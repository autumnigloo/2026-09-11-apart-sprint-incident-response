<text x="64" y="136" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">Who leaked to whom,</text>
<text x="64" y="190" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">from the transcripts alone.</text>
<text x="64" y="232" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" fill="#8FA3BF">Content hashing with first-author attribution for agent sandboxes.</text>
<text x="64" y="256" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" fill="#8FA3BF">No model access, no keys, no cooperation from the agent.</text>
