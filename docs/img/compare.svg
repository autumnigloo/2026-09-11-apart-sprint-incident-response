<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300"><rect width="1200" height="300" rx="18" fill="#0B1E3A"/><text x="40" y="40" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#3DF2C3" letter-spacing="3">WHY NOT WATERMARKS: MEASURED ON A LOCAL 0.5B MODEL</text><text x="330" y="74" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" fill="#8FA3BF">tokens the model had almost no choice on</text><text x="640" y="74" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" fill="#8FA3BF">watermark detected at 50 tokens (1% FPR)</text><text x="950" y="74" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" fill="#8FA3BF">hashing, verbatim leak ≥100 tokens</text><text x="40" y="120" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F4F7FB">prose</text><text x="140" y="120" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#8FA3BF">1.38 nats</text><rect x="330" y="100" width="260" height="28" rx="6" fill="#122B52"/><rect x="330" y="100" width="75" height="28" rx="6" fill="#FFC857"/><text x="413" y="119" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">28%</text><rect x="640" y="100" width="260" height="28" rx="6" fill="#122B52"/><rect x="640" y="100" width="208" height="28" rx="6" fill="#FF5E5B"/><text x="856" y="119" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">80%</text><rect x="950" y="100" width="200" height="28" rx="6" fill="#122B52"/><rect x="950" y="100" width="200" height="28" rx="6" fill="#3DF2C3"/><text x="1106" y="119" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#0B1E3A" font-weight="700">100%</text><text x="40" y="166" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F4F7FB">shell</text><text x="140" y="166" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#8FA3BF">1.27 nats</text><rect x="330" y="146" width="260" height="28" rx="6" fill="#122B52"/><rect x="330" y="146" width="88" height="28" rx="6" fill="#FFC857"/><text x="426" y="165" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">34%</text><rect x="640" y="146" width="260" height="28" rx="6" fill="#122B52"/><rect x="640" y="146" width="104" height="28" rx="6" fill="#FF5E5B"/><text x="752" y="165" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">40%</text><rect x="950" y="146" width="200" height="28" rx="6" fill="#122B52"/><rect x="950" y="146" width="200" height="28" rx="6" fill="#3DF2C3"/><text x="1106" y="165" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#0B1E3A" font-weight="700">100%</text><text x="40" y="212" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F4F7FB">code</text><text x="140" y="212" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#8FA3BF">0.75 nats</text><rect x="330" y="192" width="260" height="28" rx="6" fill="#122B52"/><rect x="330" y="192" width="138" height="28" rx="6" fill="#FFC857"/><text x="476" y="211" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">53%</text><rect x="640" y="192" width="260" height="28" rx="6" fill="#122B52"/><rect x="640" y="192" width="52" height="28" rx="6" fill="#FF5E5B"/><text x="700" y="211" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">20%</text><rect x="950" y="192" width="200" height="28" rx="6" fill="#122B52"/><rect x="950" y="192" width="200" height="28" rx="6" fill="#3DF2C3"/><text x="1106" y="211" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#0B1E3A" font-weight="700">100%</text><text x="40" y="258" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F4F7FB">JSON</text><text x="140" y="258" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#8FA3BF">0.73 nats</text><rect x="330" y="238" width="260" height="28" rx="6" fill="#122B52"/><rect x="330" y="238" width="172" height="28" rx="6" fill="#FFC857"/><text x="510" y="257" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">66%</text><rect x="640" y="238" width="260" height="28" rx="6" fill="#122B52"/><rect x="640" y="238" width="52" height="28" rx="6" fill="#FF5E5B"/><text x="700" y="257" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">20%</text><rect x="950" y="238" width="200" height="28" rx="6" fill="#122B52"/><rect x="950" y="238" width="200" height="28" rx="6" fill="#3DF2C3"/><text x="1106" y="257" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#0B1E3A" font-weight="700">100%</text><text x="40" y="288" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" fill="#8FA3BF">A watermark lives in the model's freedom of choice; two thirds of JSON tokens have none. Scanning a clean text against 32 run-keys raises its false-alarm rate from 1% to 15.6%.</text></svg>