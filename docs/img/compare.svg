<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1200" height="320" rx="18" fill="#0B1E3A"/><text x="40" y="40" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#3DF2C3" letter-spacing="3">WHY NOT WATERMARKS: MEASURED ON A LOCAL 0.5B MODEL</text><text x="300" y="74" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" fill="#8FA3BF">tokens the model had almost no choice on</text><text x="590" y="74" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" fill="#8FA3BF">watermark found at 50 tokens, 1% FPR (matched / pooled threshold)</text><text x="960" y="74" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" fill="#8FA3BF">hashing, verbatim leak ≥100 tokens</text><text x="40" y="118" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F4F7FB">prose</text><text x="130" y="118" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#8FA3BF">1.38 nats</text><rect x="300" y="98" width="250" height="28" rx="6" fill="#122B52"/><rect x="300" y="98" width="72" height="28" rx="6" fill="#FFC857"/><text x="380" y="117" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">28%</text><rect x="590" y="98" width="330" height="28" rx="6" fill="#122B52"/><rect x="590" y="98" width="297" height="28" rx="6" fill="#FF5E5B"/><rect x="590" y="118" width="264" height="8" rx="3" fill="#F4F7FB" fill-opacity="0.55"/><text x="895" y="117" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">90% / 80%</text><rect x="960" y="98" width="200" height="28" rx="6" fill="#122B52"/><rect x="960" y="98" width="200" height="28" rx="6" fill="#3DF2C3"/><text x="1116" y="117" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#0B1E3A" font-weight="700">100%</text><text x="40" y="164" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F4F7FB">shell</text><text x="130" y="164" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#8FA3BF">1.27 nats</text><rect x="300" y="144" width="250" height="28" rx="6" fill="#122B52"/><rect x="300" y="144" width="85" height="28" rx="6" fill="#FFC857"/><text x="393" y="163" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">34%</text><rect x="590" y="144" width="330" height="28" rx="6" fill="#122B52"/><rect x="590" y="144" width="277" height="28" rx="6" fill="#FF5E5B"/><rect x="590" y="164" width="132" height="8" rx="3" fill="#F4F7FB" fill-opacity="0.55"/><text x="875" y="163" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">84% / 40%</text><rect x="960" y="144" width="200" height="28" rx="6" fill="#122B52"/><rect x="960" y="144" width="200" height="28" rx="6" fill="#3DF2C3"/><text x="1116" y="163" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#0B1E3A" font-weight="700">100%</text><text x="40" y="210" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F4F7FB">code</text><text x="130" y="210" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#8FA3BF">0.75 nats</text><rect x="300" y="190" width="250" height="28" rx="6" fill="#122B52"/><rect x="300" y="190" width="132" height="28" rx="6" fill="#FFC857"/><text x="440" y="209" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">53%</text><rect x="590" y="190" width="330" height="28" rx="6" fill="#122B52"/><rect x="590" y="190" width="214" height="28" rx="6" fill="#FF5E5B"/><rect x="590" y="210" width="66" height="8" rx="3" fill="#F4F7FB" fill-opacity="0.55"/><text x="812" y="209" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">65% / 20%</text><rect x="960" y="190" width="200" height="28" rx="6" fill="#122B52"/><rect x="960" y="190" width="200" height="28" rx="6" fill="#3DF2C3"/><text x="1116" y="209" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#0B1E3A" font-weight="700">100%</text><text x="40" y="256" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F4F7FB">JSON</text><text x="130" y="256" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#8FA3BF">0.73 nats</text><rect x="300" y="236" width="250" height="28" rx="6" fill="#122B52"/><rect x="300" y="236" width="165" height="28" rx="6" fill="#FFC857"/><text x="473" y="255" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">66%</text><rect x="590" y="236" width="330" height="28" rx="6" fill="#122B52"/><rect x="590" y="236" width="188" height="28" rx="6" fill="#FF5E5B"/><rect x="590" y="256" width="66" height="8" rx="3" fill="#F4F7FB" fill-opacity="0.55"/><text x="786" y="255" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#F4F7FB">56% / 20%</text><rect x="960" y="236" width="200" height="28" rx="6" fill="#122B52"/><rect x="960" y="236" width="200" height="28" rx="6" fill="#3DF2C3"/><text x="1116" y="255" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#0B1E3A" font-weight="700">100%</text><text x="40" y="292" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" fill="#8FA3BF">Coral bar: detection against a 1% threshold calibrated on 50-token text; thin bar: against one pooled threshold, too strict for short spans. Scanning a clean text against 32 run-keys raises false alarms from 1% to 15.6%.</text><text x="40" y="310" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" fill="#8FA3BF">A watermark lives in the model's freedom of choice; two thirds of JSON tokens have none. Hashing needs both transcripts; a fleet of N runs is about N² pairs, so false alarms grow with fleet size for both methods.</text></svg>