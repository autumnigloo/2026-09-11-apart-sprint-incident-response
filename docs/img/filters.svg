<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Two filters decide what counts as evidence. Origination subtracts, within one run in time order, every shingle that entered the context before the span was written. Convergence subtracts, across runs, every shingle that two or more runs originated independently. Origination must run first, because convergence counts originators."><rect width="1200" height="560" rx="18" fill="#0B1E3A"/><text x="40" y="50" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#F4F7FB" font-weight="700">Two filters decide what counts as evidence</text><text x="40" y="74" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" fill="#8FA3BF">Before any text is compared, two subtractions remove what cannot prove a transmission</text><rect x="40" y="96" width="548" height="334" rx="12" fill="#122B52" stroke="#8FA3BF" stroke-width="2"/><rect x="612" y="96" width="548" height="334" rx="12" fill="#122B52" stroke="#8FA3BF" stroke-width="2"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA3BF"/></marker></defs><text x="64" y="130" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" fill="#3DF2C3" font-weight="700">1 · ORIGINATION</text><text x="64" y="150" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#8FA3BF">within one run, across time</text><rect x="64" y="170" width="116" height="54" rx="6" fill="#0B1E3A" stroke="#8FA3BF" stroke-width="1.5"/><text x="122" y="190" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" text-anchor="middle" letter-spacing=".06em">INGRESS  t1</text><text x="122" y="209" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="10.5" fill="#F4F7FB" text-anchor="middle">task prompt</text><rect x="192" y="170" width="116" height="54" rx="6" fill="#0B1E3A" stroke="#F4F7FB" stroke-width="1.5"/><text x="250" y="190" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" text-anchor="middle" letter-spacing=".06em">EGRESS  t2</text><text x="250" y="209" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="10.5" fill="#F4F7FB" text-anchor="middle">writes cipher.py</text><rect x="320" y="170" width="116" height="54" rx="6" fill="#0B1E3A" stroke="#8FA3BF" stroke-width="1.5"/><text x="378" y="190" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" text-anchor="middle" letter-spacing=".06em">INGRESS  t3</text><text x="378" y="209" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="10.5" fill="#F4F7FB" text-anchor="middle">reads a0 README</text><rect x="448" y="170" width="116" height="54" rx="6" fill="#0B1E3A" stroke="#F4F7FB" stroke-width="1.5"/><text x="506" y="190" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" text-anchor="middle" letter-spacing=".06em">EGRESS  t4</text><text x="506" y="209" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="10.5" fill="#F4F7FB" text-anchor="middle">writes README.md</text><line x1="64" y1="240" x2="556" y2="240" stroke="#8FA3BF" stroke-width="1.5" marker-end="url(#ar)"/><text x="64" y="258" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8FA3BF">turn order — the filter only ever looks backwards</text><text x="64" y="290" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" letter-spacing=".08em">THE SPAN WRITTEN AT t4, IN 5-GRAM PIECES</text><rect x="64" y="300" width="116" height="34" rx="5" fill="#0B1E3A" stroke="#FF5E5B" stroke-width="1.5"/><text x="122" y="322" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#FF5E5B" text-anchor="middle"># Overview</text><line x1="76" y1="318" x2="168" y2="318" stroke="#FF5E5B" stroke-width="1.5"/><rect x="192" y="300" width="116" height="34" rx="5" fill="#0B1E3A" stroke="#FF5E5B" stroke-width="1.5"/><text x="250" y="322" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#FF5E5B" text-anchor="middle">a substitut</text><line x1="204" y1="318" x2="296" y2="318" stroke="#FF5E5B" stroke-width="1.5"/><rect x="320" y="300" width="116" height="34" rx="5" fill="#0B1E3A" stroke="#3DF2C3" stroke-width="1.5"/><text x="378" y="322" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#3DF2C3" text-anchor="middle">rot13 helpe</text><rect x="448" y="300" width="116" height="34" rx="5" fill="#0B1E3A" stroke="#3DF2C3" stroke-width="1.5"/><text x="506" y="322" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#3DF2C3" text-anchor="middle">_shift_by(k</text><rect x="64" y="343" width="11" height="11" rx="2" fill="#0B1E3A" stroke="#FF5E5B" stroke-width="1.5"/><text x="84" y="352" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11.5" fill="#FF5E5B">already in this run's context at t3 — subtracted</text><rect x="64" y="365" width="11" height="11" rx="2" fill="#0B1E3A" stroke="#3DF2C3" stroke-width="1.5"/><text x="84" y="374" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11.5" fill="#3DF2C3">never seen before it was written — attributable</text><text x="64" y="410" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12.5" fill="#F4F7FB">An echoed prompt or a re-read file never counts as the run's own.</text><text x="636" y="130" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" fill="#3DF2C3" font-weight="700">2 · CONVERGENCE</text><text x="636" y="150" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#8FA3BF">across runs, at one moment</text><text x="636" y="178" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" letter-spacing=".08em">SHINGLE</text><text x="820" y="178" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" text-anchor="middle">a0</text><text x="856" y="178" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" text-anchor="middle">a1</text><text x="892" y="178" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" text-anchor="middle">a2</text><text x="928" y="178" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" text-anchor="middle">a3</text><text x="964" y="178" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" text-anchor="middle">a4</text><text x="1000" y="178" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" letter-spacing=".08em">OF 40</text><text x="1092" y="178" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" text-anchor="middle" letter-spacing=".08em">VERDICT</text><line x1="636" y1="188" x2="1136" y2="188" stroke="#8FA3BF" stroke-width="1"/><rect x="636" y="202" width="160" height="34" rx="5" fill="#0B1E3A" stroke="#FF5E5B" stroke-width="1.5"/><text x="716" y="223" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#FF5E5B" text-anchor="middle">import json</text><circle cx="820" cy="219" r="6.5" fill="#FF5E5B" stroke="#FF5E5B" stroke-width="1.5"/><circle cx="856" cy="219" r="6.5" fill="#FF5E5B" stroke="#FF5E5B" stroke-width="1.5"/><circle cx="892" cy="219" r="6.5" fill="#FF5E5B" stroke="#FF5E5B" stroke-width="1.5"/><circle cx="928" cy="219" r="6.5" fill="none" stroke="#8FA3BF" stroke-width="1.5"/><circle cx="964" cy="219" r="6.5" fill="#FF5E5B" stroke="#FF5E5B" stroke-width="1.5"/><text x="1000" y="223" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#8FA3BF">31</text><text x="1092" y="220" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11.5" fill="#FF5E5B" text-anchor="middle">dropped</text><rect x="636" y="248" width="160" height="34" rx="5" fill="#0B1E3A" stroke="#FF5E5B" stroke-width="1.5"/><text x="716" y="269" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#FF5E5B" text-anchor="middle">def caesar(</text><circle cx="820" cy="265" r="6.5" fill="none" stroke="#8FA3BF" stroke-width="1.5"/><circle cx="856" cy="265" r="6.5" fill="#FF5E5B" stroke="#FF5E5B" stroke-width="1.5"/><circle cx="892" cy="265" r="6.5" fill="none" stroke="#8FA3BF" stroke-width="1.5"/><circle cx="928" cy="265" r="6.5" fill="#FF5E5B" stroke="#FF5E5B" stroke-width="1.5"/><circle cx="964" cy="265" r="6.5" fill="none" stroke="#8FA3BF" stroke-width="1.5"/><text x="1000" y="269" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#8FA3BF">2</text><text x="1092" y="266" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11.5" fill="#FF5E5B" text-anchor="middle">dropped</text><text x="1092" y="280" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" text-anchor="middle">K = 2 exactly</text><rect x="636" y="294" width="160" height="34" rx="5" fill="#0B1E3A" stroke="#3DF2C3" stroke-width="1.5"/><text x="716" y="315" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#3DF2C3" text-anchor="middle">fine_rate_p</text><circle cx="820" cy="311" r="6.5" fill="none" stroke="#8FA3BF" stroke-width="1.5"/><circle cx="856" cy="311" r="6.5" fill="none" stroke="#8FA3BF" stroke-width="1.5"/><circle cx="892" cy="311" r="6.5" fill="#3DF2C3" stroke="#3DF2C3" stroke-width="1.5"/><circle cx="928" cy="311" r="6.5" fill="none" stroke="#8FA3BF" stroke-width="1.5"/><circle cx="964" cy="311" r="6.5" fill="none" stroke="#8FA3BF" stroke-width="1.5"/><text x="1000" y="315" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#8FA3BF">1</text><text x="1092" y="312" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11.5" fill="#3DF2C3" text-anchor="middle">kept</text><text x="1092" y="326" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="9.5" fill="#8FA3BF" text-anchor="middle">evidence</text><text x="636" y="363" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8FA3BF">Two runs in separate containers wrote `def caesar(` with no contact between them.</text><text x="636" y="410" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12.5" fill="#F4F7FB">Text several runs wrote alone cannot be evidence that they met.</text><rect x="40" y="452" width="1120" height="60" rx="10" fill="#0B1E3A" stroke="#FFC857" stroke-width="1.5"/><text x="64" y="478" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#FFC857" font-weight="700">ORDER IS</text><text x="64" y="495" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#FFC857" font-weight="700">LOAD-BEARING</text><text x="196" y="478" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12.5" fill="#F4F7FB">Convergence counts originators, so origination must run first. Reverse them and a receiver's re-emission</text><text x="196" y="497" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12.5" fill="#F4F7FB">registers as a second independent originator — and the leaked text is deleted as shared skeleton.</text><text x="40" y="540" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" fill="#8FA3BF">K = 2 removes 17,313 shingles across 40 solo runs · 0 hits on those runs and on both same-task baselines · RESULTS.md §3, §5, §7</text></svg>