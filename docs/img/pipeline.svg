<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200"><rect width="1200" height="200" rx="18" fill="#0B1E3A"/><rect x="15.0" y="46" width="150" height="108" rx="12" fill="#122B52" stroke="#8FA3BF" stroke-width="2"/><text x="90.0" y="78" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#8FA3BF">transcripts</text><text x="90.0" y="104" text-anchor="middle" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#F4F7FB">INGRESS / EGRESS tagged</text><polygon points="168.0,96 182.0,100 168.0,104" fill="#8FA3BF"/><rect x="185.0" y="46" width="150" height="108" rx="12" fill="#122B52" stroke="#8FA3BF" stroke-width="2"/><text x="260.0" y="78" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#8FA3BF">5-gram shingles</text><text x="260.0" y="104" text-anchor="middle" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#F4F7FB">normalise, then hash</text><polygon points="338.0,96 352.0,100 338.0,104" fill="#8FA3BF"/><rect x="355.0" y="46" width="150" height="108" rx="12" fill="#122B52" stroke="#3DF2C3" stroke-width="2"/><text x="430.0" y="78" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#3DF2C3">origination</text><text x="430.0" y="104" text-anchor="middle" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#F4F7FB">subtract what entered</text><text x="430.0" y="122" text-anchor="middle" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#F4F7FB">before it was emitted</text><polygon points="508.0,96 522.0,100 508.0,104" fill="#8FA3BF"/><rect x="525.0" y="46" width="150" height="108" rx="12" fill="#122B52" stroke="#3DF2C3" stroke-width="2"/><text x="600.0" y="78" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#3DF2C3">convergence</text><text x="600.0" y="104" text-anchor="middle" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#F4F7FB">drop shared skeleton</text><text x="600.0" y="122" text-anchor="middle" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#F4F7FB">(K = 2 solo runs)</text><polygon points="678.0,96 692.0,100 678.0,104" fill="#8FA3BF"/><rect x="695.0" y="46" width="150" height="108" rx="12" fill="#122B52" stroke="#FFC857" stroke-width="2"/><text x="770.0" y="78" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFC857">containment</text><text x="770.0" y="104" text-anchor="middle" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#F4F7FB">|window ∩ entry| /</text><text x="770.0" y="122" text-anchor="middle" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#F4F7FB">max(|window|, 40)</text><polygon points="848.0,96 862.0,100 848.0,104" fill="#8FA3BF"/><rect x="865.0" y="46" width="150" height="108" rx="12" fill="#122B52" stroke="#FF5E5B" stroke-width="2"/><text x="940.0" y="78" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#FF5E5B">hit matrix</text><text x="940.0" y="104" text-anchor="middle" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#F4F7FB">N × N, rows = source</text><polygon points="1018.0,96 1032.0,100 1018.0,104" fill="#8FA3BF"/><rect x="1035.0" y="46" width="150" height="108" rx="12" fill="#122B52" stroke="#FF5E5B" stroke-width="2"/><text x="1110.0" y="78" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#FF5E5B">topology</text><text x="1110.0" y="104" text-anchor="middle" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#F4F7FB">none / directed /</text><text x="1110.0" y="122" text-anchor="middle" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="11" fill="#F4F7FB">bidirectional / shared</text><text x="600" y="30" text-anchor="middle" font-family="SF Mono,Menlo,Consolas,Liberation Mono,monospace" font-size="13" fill="#3DF2C3" letter-spacing="3">THE DETECTOR</text><text x="600" y="182" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" fill="#8FA3BF">green stages are the two filters that make attribution honest; the floor keeps thin evidence thin</text></svg>